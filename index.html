<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단어 플래시카드</title>
<style>
:root{--bg:#f3f5f2;--surface:#fff;--ink:#17231d;--muted:#66756c;--line:#d9e0da;--accent:#1f6b4f;--accent-ink:#fff;--no:#b4492f;--no-bg:#fbebe6;--yes-bg:#e3f1ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--surface:#1b2520;--ink:#e8efea;--muted:#92a398;--line:#2e3b34;--accent:#6fcf9f;--accent-ink:#0c1a13;--no:#ef9a82;--no-bg:#3a2520;--yes-bg:#1f3a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111815;--surface:#1b2520;--ink:#e8efea;--muted:#92a398;--line:#2e3b34;--accent:#6fcf9f;--accent-ink:#0c1a13;--no:#ef9a82;--no-bg:#3a2520;--yes-bg:#1f3a2e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.drop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-size:20px;margin:4px 0 14px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:36px 16px;text-align:center;background:var(--surface);cursor:pointer}
.drop.over{border-color:var(--accent)}
.drop b{display:block;font-size:17px;margin-bottom:6px}
.drop span{color:var(--muted);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.top h1{margin:0}
.link{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:6px}
.stats{display:flex;gap:8px;margin-bottom:12px;font-size:14px}
.stats div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stats b{font-size:18px;display:block}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.opts{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--muted)}
.tog{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--ink)}
.tog[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:300px;padding:28px 20px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px}
.word{font-size:clamp(32px,9vw,46px);font-weight:700;letter-spacing:-.01em;word-break:break-word}
.badge{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.badge.k{background:var(--yes-bg);color:var(--accent)}.badge.u{background:var(--no-bg);color:var(--no)}
.mean{width:100%;min-height:84px;border:2px dashed var(--line);border-radius:12px;background:none;padding:14px;font-size:20px;color:var(--muted)}
.mean.show{border:2px solid var(--accent);color:var(--ink);background:var(--yes-bg);font-weight:600}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;padding:14px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600}
.row .no{background:var(--no-bg);color:var(--no);border-color:transparent}
.row .yes{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted);font-size:14px}
.nav button{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 14px;color:var(--ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item .w{font-weight:600}.item .m{color:var(--muted);font-size:14px}
.item button{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 10px;font-size:13px;flex:none}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.done{display:flex;flex-direction:column;gap:12px;align-items:center}
.done button{padding:12px 20px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.err{color:var(--no);font-size:14px;margin-top:10px;text-align:center}
.gbtn{padding:14px 22px;border-radius:12px;border:1px solid var(--line);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.sync{font-size:12px;color:var(--muted);margin-top:-8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
// ===== Supabase 설정: 아래 두 값을 본인 프로젝트 값으로 바꾸세요 =====
var SUPABASE_URL='https://dnjgfnpbclhukaparsoa.supabase.co';
var SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuamdmbnBiY2xodWthcGFyc29hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxODI5MzAsImV4cCI6MjEwODc1ODkzMH0.5W-9AC6__IPitT-2TAkPU0WqW-6JpU5ft4salLxZOFQ';
// ====================================================================
var KEY='flashcards-v1';
var S={deck:[],st:{},filter:'all',shuffle:false,view:'card',queue:[],pos:0,shown:false,err:''};
var app=document.getElementById('app');

var sb=null,user=null,cs='init',timer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify({deck:S.deck,st:S.st,filter:S.filter,shuffle:S.shuffle}))}catch(e){}push()}
async function pushAll(){
  var r=await sb.from('vocab').upsert({user_id:user.id,deck:S.deck,st:S.st,filter:S.filter,shuffle:S.shuffle,updated_at:new Date().toISOString()});
  if(r.error)throw r.error;
  if(cs==='err'){cs='on';render()}
}
function push(){
  if(!sb||!user||(cs!=='on'&&cs!=='err'))return;
  clearTimeout(timer);
  timer=setTimeout(function(){pushAll().catch(function(){cs='err';render()})},600);
}
function syncText(){
  return cs==='on'?'\u2601 \uacc4\uc815\uc5d0 \uc800\uc7a5 \uc911 \u00b7 '+(user&&user.email?user.email:''):cs==='err'?'\ub3d9\uae30\ud654 \uc2e4\ud328 \u00b7 \uc774 \uae30\uae30\uc5d0\ub294 \uc800\uc7a5\ub410\uc5b4\uc694':cs==='off'?'\uc774 \uae30\uae30\uc5d0\ub9cc \uc800\uc7a5\ub428 (Supabase \ubbf8\uc124\uc815)':'';
}
function login(){sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}})}
function logout(){
  sb.auth.signOut().then(function(){
    S.deck=[];S.st={};S.queue=[];user=null;cs='out';
    try{localStorage.removeItem(KEY)}catch(e){}
    render();
  });
}
async function afterAuth(){
  if(!user){cs='out';render();return}
  var r=await sb.from('vocab').select('*').eq('user_id',user.id).maybeSingle();
  if(r.error){cs='err';render();return}
  cs='on';
  if(r.data&&r.data.deck&&r.data.deck.length){
    S.deck=r.data.deck;S.st=r.data.st||{};S.filter=r.data.filter||'all';S.shuffle=!!r.data.shuffle;build();
    try{localStorage.setItem(KEY,JSON.stringify({deck:S.deck,st:S.st,filter:S.filter,shuffle:S.shuffle}))}catch(e){}
  }else if(S.deck.length){push()}
  render();
}
async function initCloud(){
  try{
    if(!window.supabase||SUPABASE_URL.indexOf('YOUR_')===0){cs='off';render();return}
    sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    var r=await sb.auth.getSession();
    user=r.data.session?r.data.session.user:null;
    sb.auth.onAuthStateChange(function(ev,sess){
      var nu=sess?sess.user:null;
      if((nu&&nu.id)!==(user&&user.id)){user=nu;afterAuth()}
    });
    await afterAuth();
  }catch(e){cs='off';render()}
}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.deck&&d.deck.length){S.deck=d.deck;S.st=d.st||{};S.filter=d.filter||'all';S.shuffle=!!d.shuffle}}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function parse(file){
  var r=new FileReader();
  r.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'array'});
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      var out=[],seen={};
      rows.forEach(function(r,i){
        var w=String(r[0]||'').trim(),m=String(r[1]||'').trim();
        if(!w||!m)return;
        if(i===0&&/^(단어|영단어|word|vocab|english|영어)/i.test(w))return;
        if(seen[w])return;seen[w]=1;out.push({w:w,m:m});
      });
      if(!out.length){S.err='단어를 찾지 못했어요. 첫 번째 열에 단어, 두 번째 열에 뜻이 있는지 확인해 주세요.';render();return}
      S.deck=out;S.st={};S.err='';S.filter='all';S.deckDirty=true;build();save();render();
    }catch(x){S.err='파일을 읽지 못했어요. .xlsx, .xls, .csv 파일인지 확인해 주세요.';render()}
  };
  r.readAsArrayBuffer(file);
}

function pass(c){var s=S.st[c.w];return S.filter==='all'||(S.filter==='u'&&s==='u')||(S.filter==='k'&&s==='k')}
function build(){
  var q=S.deck.filter(pass);
  if(S.shuffle){for(var i=q.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=q[i];q[i]=q[j];q[j]=t}}
  S.queue=q;S.pos=0;S.shown=false;
}
function count(k){return S.deck.filter(function(c){return S.st[c.w]===k}).length}
function mark(v){var c=S.queue[S.pos];if(!c)return;S.st[c.w]=v;save();S.pos++;S.shown=false;render()}
function go(d){var n=S.pos+d;if(n<0||n>S.queue.length)return;S.pos=n;S.shown=false;render()}

function render(){
  if(cs==='init'){app.innerHTML='<div class="empty">\ubd88\ub7ec\uc624\ub294 \uc911\u2026</div>';return}
  if(cs==='out'){
    app.innerHTML='<h1>\ub2e8\uc5b4 \ud50c\ub798\uc2dc\uce74\ub4dc</h1><div class="card"><div style="color:var(--muted)">\ub85c\uadf8\uc778\ud558\uba74 \ub2e8\uc5b4\uc7a5\uacfc \uc678\uc6c0 \ud45c\uc2dc\uac00<br>\ubaa8\ub4e0 \uae30\uae30\uc5d0\uc11c \uc774\uc5b4\uc838\uc694.</div><button class="gbtn" id="login">Google\ub85c \ub85c\uadf8\uc778</button></div>';
    document.getElementById('login').onclick=login;return;
  }
  if(!S.deck.length){
    app.innerHTML='<h1>단어 플래시카드</h1><label class="drop" id="drop" tabindex="0"><b>엑셀 파일을 올려 주세요</b><span>첫 번째 열: 영단어 / 두 번째 열: 뜻<br>.xlsx · .xls · .csv</span><input type="file" id="file" accept=".xlsx,.xls,.csv" hidden></label><div class="err">'+esc(S.err)+'</div>';
    var d=document.getElementById('drop'),f=document.getElementById('file');
    f.onchange=function(){if(f.files[0])parse(f.files[0])};
    d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();f.click()}};
    d.ondragover=function(e){e.preventDefault();d.classList.add('over')};
    d.ondragleave=function(){d.classList.remove('over')};
    d.ondrop=function(e){e.preventDefault();d.classList.remove('over');if(e.dataTransfer.files[0])parse(e.dataTransfer.files[0])};
    return;
  }
  var k=count('k'),u=count('u'),n=S.deck.length;
  var h='<div class="top"><h1>단어 플래시카드</h1><div><button class="link" id="reup">다른 파일 올리기</button>'+(user?'<button class="link" id="logout">로그아웃</button>':'')+'</div></div><div class="sync">'+syncText()+'</div><div style="height:12px"></div>';
  h+='<div class="stats"><div><b>'+n+'</b>전체</div><div><b style="color:var(--accent)">'+k+'</b>외웠다</div><div><b style="color:var(--no)">'+u+'</b>안 외웠다</div></div>';
  h+='<div class="seg" role="group" aria-label="보기 범위">'+[['all','전체'],['u','안 외운 것'],['k','외운 것']].map(function(a){return '<button data-f="'+a[0]+'" aria-pressed="'+(S.filter===a[0])+'">'+a[1]+'</button>'}).join('')+'</div>';
  h+='<div class="opts"><div class="seg" style="margin:0;width:150px" role="group" aria-label="화면"><button data-v="card" aria-pressed="'+(S.view==='card')+'">카드</button><button data-v="list" aria-pressed="'+(S.view==='list')+'">목록</button></div><button class="tog" id="shuf" aria-pressed="'+S.shuffle+'">셔플 '+(S.shuffle?'켜짐':'꺼짐')+'</button></div>';

  if(S.view==='list'){
    var items=S.deck.filter(pass);
    h+=items.length?'<div class="list">'+items.map(function(c,i){var s=S.st[c.w];return '<div class="item"><div><div class="w">'+esc(c.w)+'</div><div class="m">'+esc(c.m)+'</div></div><button data-t="'+S.deck.indexOf(c)+'">'+(s==='k'?'안 외웠다로':'외웠다로')+'</button></div>'}).join('')+'</div>':'<div class="list"><div class="empty">이 범위에 해당하는 단어가 없어요.</div></div>';
  }else if(!S.queue.length){
    h+='<div class="card"><div class="empty">이 범위에 해당하는 단어가 없어요.<br>위에서 다른 범위를 골라 보세요.</div></div>';
  }else if(S.pos>=S.queue.length){
    h+='<div class="card"><div class="done"><div class="word" style="font-size:28px">한 바퀴 끝!</div><div style="color:var(--muted)">'+S.queue.length+'개를 모두 봤어요.</div><button id="again">다시 시작</button></div></div>';
  }else{
    var c=S.queue[S.pos],s=S.st[c.w];
    h+='<div class="card"><span class="badge '+(s||'')+'">'+(s==='k'?'외웠다':s==='u'?'안 외웠다':'아직 안 봄')+'</span><div class="word">'+esc(c.w)+'</div><button class="mean'+(S.shown?' show':'')+'" id="mean">'+(S.shown?esc(c.m):'뜻 보기 (터치)')+'</button></div>';
    h+='<div class="row"><button class="no" id="no">안 외웠다</button><button class="yes" id="yes">외웠다</button></div>';
    h+='<div class="nav"><button id="prev"'+(S.pos===0?' disabled':'')+'>이전</button><span>'+(S.pos+1)+' / '+S.queue.length+'</span><button id="next">건너뛰기</button></div>';
    h+='<div class="hint">키보드: 스페이스 = 뜻 보기 · 1 = 안 외웠다 · 2 = 외웠다 · ← → 이동</div>';
  }
  app.innerHTML=h;
  var $=function(id){return document.getElementById(id)};
  $('reup').onclick=function(){if(confirm('다른 파일을 올리면 현재 단어장과 외움 표시가 초기화돼요. 계속할까요?')){S.deck=[];S.st={};save();render()}};
  if($('logout'))$('logout').onclick=logout;
  app.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){S.filter=b.dataset.f;build();save();render()}});
  app.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){S.view=b.dataset.v;render()}});
  $('shuf').onclick=function(){S.shuffle=!S.shuffle;build();save();render()};
  app.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){var c=S.deck[+b.dataset.t];S.st[c.w]=S.st[c.w]==='k'?'u':'k';save();build();render()}});
  if($('mean'))$('mean').onclick=function(){S.shown=!S.shown;render()};
  if($('yes'))$('yes').onclick=function(){mark('k')};
  if($('no'))$('no').onclick=function(){mark('u')};
  if($('prev'))$('prev').onclick=function(){go(-1)};
  if($('next'))$('next').onclick=function(){go(1)};
  if($('again'))$('again').onclick=function(){build();render()};
}

document.addEventListener('keydown',function(e){
  if(S.view!=='card'||!S.deck.length||S.pos>=S.queue.length)return;
  if(e.key===' '){e.preventDefault();S.shown=!S.shown;render()}
  else if(e.key==='1')mark('u');
  else if(e.key==='2')mark('k');
  else if(e.key==='ArrowRight')go(1);
  else if(e.key==='ArrowLeft')go(-1);
});

load();build();render();initCloud();
})();
</script>
</body>
</html>
